<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blunts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;700;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#070504;
  --smoke:#120C08;
  --glass:rgba(28,19,13,.82);
  --line:rgba(243,231,207,.12);
  --paper:#F3E7CF;
  --dim:#A8957A;
  --faint:#6E5E4B;
  --leaf:#8DBB50;
  --leaf-deep:#3E5E1C;
  --gold:#F5C451;
  --ember:#FF6A2B;
  --bad:#E5705A;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#app{position:relative;height:100%;max-width:470px;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 42%,#2a1a0f 0%,#140d08 55%,#080504 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#money{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:19}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hud-row{width:100%;display:flex;justify-content:space-between;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(20,13,9,.55);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--display);font-size:15px;line-height:1;pointer-events:auto}
.chip svg{display:block}
.chip.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.25);box-shadow:0 0 24px rgba(245,196,81,.6)}100%{transform:scale(1)}}
.menu-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,13,9,.55);border:1px solid var(--line);pointer-events:auto}
.wad{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.wad-num{font-family:var(--display);font-size:46px;line-height:1;color:var(--gold);text-shadow:0 3px 0 #5b340d,0 0 28px rgba(245,196,81,.35);display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.wad-num .cur{font-size:28px;opacity:.85}
.grown{font-family:var(--display);font-size:13px;color:var(--leaf);display:flex;align-items:center;gap:4px}
.grown.down{color:var(--bad)}
.pips{display:flex;gap:5px;margin-top:4px}
.pips i{width:26px;height:6px;border-radius:9px;background:rgba(243,231,207,.12);overflow:hidden;position:relative}
.pips i b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#6f9a33,#a9d35f);border-radius:9px;box-shadow:0 0 10px rgba(169,211,95,.6)}

/* ---------- bottom actions ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;justify-content:space-between;align-items:flex-end;z-index:6;pointer-events:none}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
.act .orb{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .15s}
.act:active .orb{transform:scale(.93)}
.act .lbl{font-family:var(--display);font-size:16px;letter-spacing:.04em}
.act.fill .orb{background:radial-gradient(circle at 35% 30%,#b7e27a,#6c9a2f 55%,#34511a);box-shadow:0 10px 30px -6px rgba(141,187,80,.55),inset 0 -6px 12px rgba(0,0,0,.25)}
.act.spark .orb{background:radial-gradient(circle at 35% 30%,#ffc07a,#ff6a2b 55%,#8f2d0d);box-shadow:0 10px 30px -6px rgba(255,106,43,.55),inset 0 -6px 12px rgba(0,0,0,.25)}
.act.fill .lbl{color:#b7e27a} .act.spark .lbl{color:#ffab6b}
.act.nudge .orb{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 10px 30px -6px rgba(141,187,80,.55),0 0 0 0 rgba(141,187,80,.5)}50%{box-shadow:0 10px 30px -6px rgba(141,187,80,.55),0 0 0 18px rgba(141,187,80,0)}}
.act[disabled]{opacity:.35;pointer-events:none}
.busy .act{opacity:.5;pointer-events:none}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(5,3,2,.45);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:18px;animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:88%;overflow-y:auto}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(243,231,207,.2);align-self:center}
.big{display:flex;align-items:center;justify-content:center;gap:16px}
.step{width:48px;height:48px;border-radius:50%;background:rgba(243,231,207,.08);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--dim)}
.step:active{background:rgba(243,231,207,.16)}
.amt{font-family:var(--display);font-size:54px;line-height:1;min-width:170px;text-align:center}
.amt.gold{color:var(--gold);text-shadow:0 0 30px rgba(245,196,81,.35)}
.amt.leafy{color:#b7e27a}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border-radius:18px;background:rgba(243,231,207,.05);border:1.5px solid transparent;font-family:var(--display);font-size:15px}
.tile.on{border-color:#b7e27a;background:rgba(141,187,80,.12)}
.pays{display:flex;justify-content:center;gap:14px}
.pay{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;opacity:.45;transition:.15s;border:2px solid transparent}
.pay.on{opacity:1;border-color:var(--paper);transform:scale(1.08)}
.go{height:64px;border-radius:22px;font-family:var(--display);font-size:22px;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px}
.go.fill{background:linear-gradient(180deg,#a9d35f,#6c9a2f);color:#15210a;box-shadow:0 8px 24px -8px rgba(141,187,80,.7)}
.go.spark{background:linear-gradient(180deg,#ffa25f,#ff6a2b);color:#2a0e03;box-shadow:0 8px 24px -8px rgba(255,106,43,.7)}
.go:active{transform:scale(.98)}
.blunts-pick{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.bp{padding:6px 2px}
.bp svg{display:block}
.bp.on .tipglow{opacity:1}
.fee{font-size:13px;color:var(--dim);text-align:center;font-weight:700;margin-top:-10px;display:flex;align-items:center;justify-content:center;gap:6px}
.all{align-self:center;padding:7px 16px;border-radius:999px;border:1.5px solid rgba(243,231,207,.2);font-family:var(--display);font-size:13px;color:var(--dim)}
.all.on{border-color:var(--ember);color:#ffab6b;background:rgba(255,106,43,.12)}

.spick{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.scount{display:flex;flex-direction:column;align-items:center;gap:6px}
.sk{font-family:var(--display);font-size:26px;color:var(--paper)}
.scount .blunts-pick{gap:2px;max-width:190px}
.scount .bp{padding:3px 1px}
.scount .bp svg{width:34px;height:14px}
.step[disabled]{opacity:.25}
.outs{display:flex;flex-direction:column;gap:8px}
.out{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:rgba(243,231,207,.06);text-align:left}
.out:active{background:rgba(243,231,207,.12)}
.out .on{font-family:var(--display);font-size:17px}
.out .sp{font-size:13px;font-weight:800;color:var(--dim)}
.mbig{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:rgba(243,231,207,.06);font-family:var(--display);font-size:20px;text-align:left}
.mbig:active{background:rgba(243,231,207,.12)}
.mbig .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(243,231,207,.08)}
.how{display:flex;flex-direction:column;gap:16px;touch-action:pan-y}
.hcard{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:up .25s ease-out}
.hv{display:flex;flex-direction:column;align-items:center;gap:10px}
.hc{font-family:var(--display);font-size:24px;text-align:center;line-height:1.1;text-wrap:balance}
.hrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hrow span{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:14px;background:rgba(243,231,207,.06);font-size:13px;font-weight:800;color:var(--dim)}
.hrow b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold)}
.qbig{font-family:var(--display);font-size:64px;color:var(--gold);text-shadow:0 4px 0 #5b340d}
.logos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.logos span{padding:6px 10px;border-radius:999px;background:rgba(243,231,207,.07);font-weight:800;font-size:13px}
.fall{animation:fall 1.6s ease-in infinite}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}25%{opacity:1}80%{transform:translateY(62px);opacity:1}100%{transform:translateY(62px);opacity:0}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(243,231,207,.2)}
.dots i.on{width:22px;background:var(--gold)}
.demo-panel{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:25;background:rgba(15,10,7,.92);border:1px solid var(--gold);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rail{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 4px}
.addr{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:rgba(243,231,207,.07);font-family:"DM Mono",ui-monospace,monospace;font-size:17px;color:var(--paper)}
.addr.ok{background:rgba(141,187,80,.18);color:#b7e27a}
.go.cash{width:100%;background:linear-gradient(180deg,#22d65f,#00a83a);color:#04210d;box-shadow:0 8px 24px -8px rgba(0,194,68,.7)}
.alt{font-size:13.5px;font-weight:800;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.sp2{font-weight:800;color:var(--dim)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(243,231,207,.15);border-top-color:#b7e27a;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big-ok{font-family:var(--display);font-size:44px;color:#b7e27a}
.out.ghost{background:none;border:1.5px dashed rgba(243,231,207,.2)}
.out .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(243,231,207,.08);font-family:var(--display);font-size:22px}
.seg{align-self:center;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(243,231,207,.07)}
.seg button{height:38px;min-width:74px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--dim)}
.seg button svg{width:40px;height:16px}
.seg button.on{background:var(--ember);color:#2a0e03}
.spk{display:flex;flex-direction:column;gap:14px;align-items:center}
.cashin{display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:var(--display);color:var(--gold);text-shadow:0 0 30px rgba(245,196,81,.35)}
.cashin span{font-size:40px}
.cashin input{width:1.4ch;min-width:1.4ch;max-width:8ch;text-align:left;background:none;border:0;border-bottom:2px solid rgba(245,196,81,.35);color:var(--gold);font:inherit;font-size:58px;outline:none;padding:0}
.cashin input::placeholder{color:rgba(245,196,81,.3)}
.cashin input:focus{border-bottom-color:var(--gold)}
.maxb{padding:9px 18px;border-radius:999px;background:rgba(243,231,207,.07);font-family:var(--display);font-size:14px;color:var(--dim)}
.maxb.on{background:rgba(245,196,81,.18);color:var(--gold)}
.go[disabled]{opacity:.4}
.fillseg button.on{background:#8dbb50;color:#15210a}
.cashin.leaf,.cashin.leaf input{color:#b7e27a;text-shadow:0 0 30px rgba(141,187,80,.35)}
.cashin.leaf input{border-bottom-color:rgba(141,187,80,.35)}
.cashin.leaf input::placeholder{color:rgba(141,187,80,.3)}
.cashin.leaf input:focus{border-bottom-color:#8dbb50}
.fill-icons{gap:4px}
.wad-num > svg,#grown,#pips{display:none!important}
.hc.sm{font-size:19px}
.learn{align-self:center;padding:9px 18px;border-radius:999px;border:1.5px solid rgba(245,196,81,.4);color:var(--gold);font-weight:800;font-size:14px}
.info{position:absolute;inset:0;z-index:24;background:var(--smoke);overflow-y:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.info-in{padding:calc(env(safe-area-inset-top,0px) + 56px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:34px}
.info-x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border-radius:50%;background:rgba(243,231,207,.08);font-size:16px;z-index:2;right:max(16px,calc(50% - 235px + 16px))}
.info section{display:flex;flex-direction:column;gap:12px}
.info .kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:800}
.info h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.info p{margin:0;color:var(--dim);font-size:15.5px;line-height:1.5}
.info .fine2{font-size:12px;color:var(--faint)}
.basket{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.bchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
.bchips span{padding:5px 10px;border-radius:999px;background:rgba(243,231,207,.07);font-weight:800;font-size:12.5px;animation:pop .4s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.bq{font-family:var(--display);font-size:56px;color:var(--gold);text-shadow:0 4px 0 #5b340d;line-height:1}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.facts div{background:rgba(243,231,207,.05);border-radius:16px;padding:12px;display:flex;flex-direction:column;font-size:12.5px;font-weight:800;color:var(--dim)}
.facts b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold)}
.sizes{display:flex;flex-direction:column;gap:6px}
.sizes div{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}
.sizes i{height:14px;border-radius:9px;background:linear-gradient(90deg,#6c9a2f,#a9d35f)}
/* menu */
.mrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(243,231,207,.06)}
.mrow .a{font-family:var(--display);font-size:16px}
.mrow .a.in{color:#b7e27a}
.mrow .d{font-size:12.5px;color:var(--faint);font-weight:700}
.mrow .x{font-size:12px;color:var(--faint);font-weight:700;text-align:right}
.mh{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:800}
.tick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tick div{background:rgba(243,231,207,.05);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.tick span{color:var(--faint)}
.qqq{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qqq .qt{font-family:var(--display);font-size:24px;color:var(--gold)}
.qqq .qd{font-size:13px;font-weight:700;color:var(--dim)}
.demo{display:flex;flex-wrap:wrap;gap:6px}
.demo button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--dim)}
.demo button.on{border-color:var(--gold);color:var(--gold)}
.note{font-size:12.5px;color:var(--faint);line-height:1.45;margin:0}

/* payout pop */
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
.pop.show{animation:pop 2.6s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.pop .v{font-family:var(--display);font-size:52px;color:var(--gold);text-shadow:0 4px 0 #5b340d,0 0 40px rgba(245,196,81,.6)}
.pop .to{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--paper)}
.stamp{position:absolute;left:50%;top:33%;z-index:15;pointer-events:none;font-family:var(--display);font-size:44px;line-height:.9;text-align:center;color:var(--gold);text-shadow:0 4px 0 #5b340d,0 0 40px rgba(245,196,81,.5);opacity:0;transform:translate(-50%,-50%) rotate(-7deg)}
.stamp.show{animation:stamp 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1.1)}28%{transform:translate(-50%,-50%) rotate(-7deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) rotate(-7deg)}}
.boot{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:28px;z-index:30;background:var(--void);transition:opacity .5s}
.boot.gone{opacity:0;pointer-events:none}
</style>

<div id="app">
  <canvas id="gl" aria-label="Your blunt tray"></canvas>
  <canvas id="money" aria-hidden="true"></canvas>

  <div class="hud">
    <div class="hud-row">
      <div style="display:flex;gap:8px;margin-right:auto" id="chipsL"><div class="chip" id="chipBlunts" aria-label="Blunts rolled">
        <svg width="30" height="12" viewBox="0 0 30 12"><defs><linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a3c"/><stop offset="1" stop-color="#5a3719"/></linearGradient></defs><path d="M3 3.2 L26 2 Q29 2 29 6 Q29 10 26 10 L3 8.8 Q1 8.6 1 6 Q1 3.4 3 3.2Z" fill="url(#bl)"/><path d="M8 2.8l-2 6.6M14 2.5l-2 7.2M20 2.2l-2 7.6" stroke="#3a220f" stroke-width=".8" opacity=".6"/></svg>
        <span id="nBlunts">4</span>
      </div><div class="chip" id="chipBands" aria-label="Bands">
        <svg width="26" height="18" viewBox="0 0 26 18"><rect x="1" y="3" width="24" height="13" rx="3" fill="#3e5e1c"/><rect x="1" y="1" width="24" height="13" rx="3" fill="#7fae45"/><rect x="10" y="0" width="6" height="17" rx="1.5" fill="#c8412f"/></svg>
        <span id="nBands">0</span>
      </div></div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#F3E7CF" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h10"/></svg></button>
    </div>

/* dissolve material for sparking: same geometry, burns away from the tip */
const BURN_GLSL = `
varying vec3 vLp; uniform float uBurn;
float h3(vec3 p){ p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }`;

  m.onBeforeCompile = sh => {
    sh.uniforms.uBurn = m.userData.uBurn;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLp;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvLp = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + BURN_GLSL)
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        float bn = vn(vLp * 7.0) * .38 + vn(vLp * 22.0) * .28 + vn(vLp * 60.0) * .2 + vn(vLp * 150.0) * .14;
        float bEdge = mix(${(HL + .2).toFixed(3)}, ${(-HL - .2).toFixed(3)}, uBurn);
        float bd = (vLp.z + (bn - .5) * .3) - bEdge;
        if (bd > 0.0) discard;`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        float ash = smoothstep(-.2, -.035, bd);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.16, .15, .14), ash);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float bg = smoothstep(-.03, 0.0, bd);
        totalEmissiveRadiance += vec3(4.0, 1.3, .25) * bg * bg + vec3(.9, .25, .05) * smoothstep(-.07, -.02, bd) * (1. - bg);`);

}

/* quarter markers */

  for (let q = 1; q <= 3; q++) {

    for (let k = 0; k <= 8; k++) { const v = .22 + .56 * k / 8, phi = (v - .5) * TH_OPEN; pts.push(new THREE.Vector3(x, R - R * Math.cos(phi) + 0.01, R * Math.sin(phi))); }
    const g = new THREE.BufferGeometry().setFromPoints(pts); const p = new THREE.Points(g, mat.clone()); inner.add(p); qDots.push(p);

}

/* sprites */

}
function burst(pos, n, o = {}) {

}

/* dust */

function build() {

  glowTex = makeSoft('rgba(255,150,60,1)', 'rgba(255,90,20,0)');
  dotTex = makeSoft('rgba(255,230,190,1)', 'rgba(255,230,190,0)');
  ashTex = makeSoft('rgba(170,165,160,.9)', 'rgba(120,115,110,0)');
  smokeTex = makeSmoke();
  leafMat = new THREE.MeshStandardMaterial({ map: leafTex, bumpMap: leafTex, bumpScale: 0.012, roughness: .58, metalness: 0, side: THREE.DoubleSide });

  // tray
  const tw = 2.84, td = 2.5, tr = 0.22;
  const rr = (w, d, r) => { const s = new THREE.Shape(); const x = -w / 2, y = -d / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
  const trayMat = new THREE.MeshStandardMaterial({ color: lin('#231710'), metalness: .75, roughness: .38 });
  const base = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(tw, td, tr), { depth: 0.06, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 2, curveSegments: 10 }), trayMat);
  base.geometry.rotateX(-Math.PI / 2); base.position.set(0, 0.0, 0.08); scene.add(base);
  const ring = rr(tw + .02, td + .02, tr); const hole = rr(tw - .12, td - .12, tr - .06); ring.holes.push(hole);
  const rimMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(ring, { depth: 0.16, bevelEnabled: true, bevelThickness: .02, bevelSize: .015, bevelSegments: 3, curveSegments: 10 }), new THREE.MeshStandardMaterial({ color: lin('#3a2616'), metalness: .85, roughness: .28 }));

/* instantly place a partially filled pile (no animation) */
function presetFill(amount) {
  const n = Math.round(amount / 100 * NS);
  for (let i = 0; i < NS; i++) { if (i < n) { slot.state[i] = 2; setSlotMatrix(i, slot.x[i], slot.y[i], slot.z[i], slot.q[i]); } else { slot.state[i] = 0; hideSlot(i); } }
  spawned = landed = n; flagPile();
}

/* ================= CAMERA FIT ================= */
function resize() {
  const w = app.clientWidth, h = app.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const needW = 1.54, needH = 1.5;
  const usable = 1 - (270 / h); // HUD top + dock bottom
  camDist = Math.max(needW / (tanH * camera.aspect), needH / (tanH * Math.max(.45, usable)));
  camTarget.y = 0.25 - (h < 700 ? 0.05 : 0);
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); sizeBillLayer(); }).observe(app);

/* ================= TWEENS ================= */
const tweens = [];
function tween(dur, fn, ease = easeIO) { return new Promise(res => { if (reduce) dur = Math.min(dur, .12); tweens.push({ t: 0, dur, fn, ease, res }); }); }
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

/* ================= FILL ================= */
let pourQueue = null, dollarsLeft = 0;
function pour(fromAmt, toAmt, speed = 1) {
  const s0 = Math.round(fromAmt / 100 * NS), s1 = Math.round(toAmt / 100 * NS);
  const dur = clamp((toAmt - fromAmt) * 0.17, 3.0, 8.0) / speed;
  dollarsLeft += Math.max(1, Math.round((toAmt - fromAmt) / 2.6 / Math.max(1, speed * .8)));
  const order = []; for (let i = s0; i < s1; i++) order.push(i);
  for (let i = order.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
  return new Promise(res => { pourQueue = { s0, s1, order, oi: 0, next: s0, rate: (s1 - s0) / dur, acc: 0, dlrRate: dollarsLeft / dur, dAcc: 0, res, quarterFrom: Math.floor(fromAmt / 25 + 1e-6) }; });
}
function spawnFlake(i) {
  slot.state[i] = 1; slot.px[i] = slot.x[i] + rand(-.2, .2); slot.py[i] = rand(2.4, 3.6); slot.pz[i] = slot.z[i] + rand(-.5, .3); slot.vy[i] = -rand(.25, .5); slot.ang[i] = rand(0, 6); slot.t0[i] = slot.py[i];
}
const qtmp = new THREE.Quaternion();
function stepFlakes(dt) {
  if (pourQueue) {
    const P = pourQueue; P.acc += P.rate * dt;
    while (P.acc >= 1 && P.oi < P.order.length) { spawnFlake(P.order[P.oi++]); P.acc -= 1; spawned++; }
    P.dAcc += P.dlrRate * dt;
    while (P.dAcc >= 1 && dollarsLeft > 0) { spawnDollar(); P.dAcc -= 1; dollarsLeft--; }
  }
  let changed = false;
  for (let i = 0; i < NS; i++) {
    if (slot.state[i] !== 1) continue;
    changed = true;
    slot.vy[i] = Math.max(slot.vy[i] - 1.1 * dt, -1.05); slot.py[i] += slot.vy[i] * dt;
    const prog = clamp(1 - (slot.py[i] - slot.y[i]) / (slot.t0[i] - slot.y[i]), 0, 1);
    const k = 1 - Math.pow(1 - prog, 2);
    const x = lerp(slot.px[i], slot.x[i], k), z = lerp(slot.pz[i], slot.z[i], k);
    slot.ang[i] += dt * 4;
    if (slot.py[i] <= slot.y[i]) {
      slot.state[i] = 2; landed++; setSlotMatrix(i, slot.x[i], slot.y[i], slot.z[i], slot.q[i]);
      const amtNow = landed / NS * 100; const q = Math.floor(amtNow / 25 + 1e-6);
      if (pourQueue && q > pourQueue.quarterFrom && q < 4) { pourQueue.quarterFrom = q; quarterPulse(q); }
    } else {
      qtmp.setFromAxisAngle(slot.spin[i], slot.ang[i]); qtmp.multiply(slot.q[i]);
      setSlotMatrix(i, x, slot.py[i], z, qtmp, 1.15);
    }
  }
  if (changed) { flagPile(); setPips(landed / NS * 100); }
  if (pourQueue && pourQueue.oi >= pourQueue.order.length) {
    let allDown = true; for (let i = pourQueue.s0; i < pourQueue.s1; i++) if (slot.state[i] === 1) { allDown = false; break; }
    if (allDown && dollarsLeft <= 0) { const r = pourQueue.res; pourQueue = null; r(); }
  }
}
function spawnDollar() {
  const i = pourQueue ? pourQueue.order[(Math.random() * pourQueue.order.length) | 0] : Math.max(0, landed - 1);
  const target = new THREE.Vector3(slot.x[i], slot.y[i] + 0.03, slot.z[i]);
  const start = new THREE.Vector3(target.x + rand(-.3, .3), rand(2.2, 3.4), target.z + rand(-.4, .3));
  const d = addSprite(dollarTex, { pos: start, size: rand(.24, .32), life: 99, parent: inner, kind: 'dollar', target, vy: -rand(.2, .35), color: 0xffe08a });
  d.sparks = [0, 1, 2, 3].map(k => addSprite(sparkTex, { pos: start.clone(), size: .06, life: 99, parent: inner, kind: 'orbit', host: d, ph: k * 1.6 + rand(0, 1), rad: rand(.13, .19), color: 0xfff1c0 }));
}
function quarterPulse(q) {
  const dots = qDots[q - 1]; if (dots) { dots.material.opacity = 1; dots.material.size = 0.14; }
  const wp = inner.localToWorld(new THREE.Vector3(-0.97 + 1.94 * q / 4, 0.15, 0));
  burst(inner.localToWorld(new THREE.Vector3(-0.97 + 1.94 * q / 4, 0.15, 0)), 28, { power: 1.1 });
  const ring = addSprite(glowTex, { pos: wp.clone(), size: .2, life: .7, kind: 'ring', op: .9 });
  ring.grow = 2.4;
  haptic(12);
}

async function rollUp(fast = false) {
  const sp = fast ? 1.8 : 1;
  qDots.forEach(d => d.visible = false);
  await wait(200 / sp);
  await tween(1.25 / sp, t => { curl = t; shapeSheet(t); setTilt(1 - t); });
  // seal shimmer
  const wp = pivot.position.clone();
  for (let k = 0; k < 5; k++) burst(wp.clone().add(new THREE.Vector3(-0.9 + k * 0.45, 0.05, 0)), 8, { power: .6 });
  showStamp(vis.stash + 1 === 10 * Math.ceil((vis.stash + 1) / 10) ? '' : '', '');
  haptic(30);
  await tween(.55 / sp, t => { pivot.rotation.x = t * Math.PI * 2; pivot.position.y = HOME.y + Math.sin(t * Math.PI) * 0.35; }, easeIO);
  pivot.rotation.x = 0;
  const n = vis.stash + 1; const { list } = stashSlots(n); const dst = n % 10 === 0 ? { x: 0.09 + 9 * 0.12, y: FLOOR + 0.062 } : list[list.length - 1];
  const from = pivot.position.clone(); const to = new THREE.Vector3(dst.x, dst.y, STASH_Z);
  await tween(.75 / sp, t => {
    pivot.position.lerpVectors(from, to, t); pivot.position.y += Math.sin(t * Math.PI) * 0.6;
    pivot.scale.setScalar(lerp(1, STASH_S, t)); pivot.rotation.y = -Math.PI / 2 * t;
  }, easeIO);
  vis.stash = n; rebuildStash(n, n % 10 === 0); bumpChip('#chipBlunts'); setCounts();
  burst(to, 20, { power: .8 });
  // reset the wrap: fresh one unrolls in from the side
  presetFill(0); for (const s of sprites) if (s.kind === 'dollar' || s.kind === 'orbit') s.dead = true;
  pivot.scale.setScalar(1); pivot.rotation.set(0, 0, 0); pivot.position.set(3.2, HOME.y, HOME.z);
  if (n % 10 === 0) await bandUp(n);
  await tween(.8 / sp, t => { pivot.position.x = lerp(3.2, 0, t); curl = 1 - t; shapeSheet(curl); setTilt(t); }, easeOut);
  qDots.forEach(d => { d.visible = true; d.material.opacity = .55; d.material.size = .06; });
  setPips(0);
}
const elasticOut = t => t === 0 || t === 1 ? t : Math.pow(2, -9 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI) / 3) + 1;
async function bandUp(n) {
  const b = Math.floor(n / 10) - 1;
  showStamp('BAND UP'); haptic([20, 40, 20]); billRain(110); const rainStart = performance.now();
  if (b > 5 || !stashBands[b]) { bumpChip('#chipBands'); setCounts(); await wait(5000); return; }
  const ms = stashBlunts.slice(b * 10, b * 10 + 10), froms = ms.map(m => m.position.clone());
  await tween(.7, t => ms.forEach((m, j) => { const k = clamp(t * 1.4 - j * .04, 0, 1), e = easeIO(k); m.position.lerpVectors(froms[j], m.userData.to, e); m.position.y += Math.sin(e * Math.PI) * .12; }), t => t);
  const bands = stashBands[b]; bands.forEach(t => { t.visible = true; });
  await tween(.6, t => bands.forEach(m => { const k = lerp(1.6, 1, elasticOut(t)); m.scale.set(k, k, 1); }), t => t);
  const p = ms[0].userData.to; burst(new THREE.Vector3(p.x + .24, p.y + .15, STASH_Z), 40, { power: 1.2 });
  bumpChip('#chipBands'); setCounts();
  await wait(Math.max(700, 4000 - (performance.now() - rainStart)));

/* $100 bill rain for BAND UP.
   Own layer above all UI, straight-on orthographic camera, constant fall speed until fully off screen.
   Bills bend and flutter in the vertex shader; front/back scans chosen by face direction. */
const VH = 10;                       // view height in world units
let billMesh = null, billRenderer = null, billScene = null, billCam = null, billsDrawn = false;
const BILLS_MAX = 150, billState = [];
const billUniforms = { uTime: { value: 0 } };
function initBillLayer() {
  billRenderer = new THREE.WebGLRenderer({ canvas: $('#money'), antialias: true, alpha: true });
  billRenderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  billRenderer.outputEncoding = THREE.sRGBEncoding; billRenderer.toneMapping = THREE.ACESFilmicToneMapping; billRenderer.toneMappingExposure = .95;
  billRenderer.setClearColor(0x000000, 0);
  billScene = new THREE.Scene();
  billCam = new THREE.OrthographicCamera(-1, 1, VH / 2, -VH / 2, .1, 100); billCam.position.set(0, 0, 30); billCam.lookAt(0, 0, 0);
  billScene.add(new THREE.HemisphereLight(0xfff3e0, 0x2b1d12, .55));
  const key = new THREE.DirectionalLight(0xffe6c4, .95); key.position.set(-4, 6, 10); billScene.add(key);
  sizeBillLayer();
}
function sizeBillLayer() {
  if (!billRenderer) return;
  const w = app.clientWidth, h = app.clientHeight; billRenderer.setSize(w, h, false);
  const hw = VH / 2 * (w / h); billCam.left = -hw; billCam.right = hw; billCam.updateProjectionMatrix();
}
function buildBillMesh() {
  initBillLayer();
  const ld = new THREE.TextureLoader();
  const front = ld.load(BILL_FRONT_SRC), back = ld.load(BILL_BACK_SRC);
  [front, back].forEach(t => { t.encoding = THREE.sRGBEncoding; t.anisotropy = billRenderer.capabilities.getMaxAnisotropy(); });
  const geo = new THREE.PlaneGeometry(1, 0.421, 24, 8);   // real 2.37:1 note proportions
  const phase = new Float32Array(BILLS_MAX); for (let i = 0; i < BILLS_MAX; i++) phase[i] = rand(0, 20);
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));
  const mat = new THREE.MeshStandardMaterial({ map: front, color: 0xe2e2d6, side: THREE.DoubleSide, roughness: .85, metalness: 0 });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = billUniforms.uTime; sh.uniforms.uBack = { value: back };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; attribute float aPhase;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float bp = aPhase + uTime;
        float A = 1.6 + 1.1 * sin(bp * 1.7), B = .7 * sin(bp * 2.3);
        transformed.z += transformed.y * transformed.y * A + sin(transformed.x * 5.0 + bp * 4.0) * .03 + transformed.x * transformed.x * B;`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        { float bp2 = aPhase + uTime; float A2 = 1.6 + 1.1 * sin(bp2 * 1.7), B2 = .7 * sin(bp2 * 2.3);
          objectNormal = normalize(vec3(-(cos(position.x * 5.0 + bp2 * 4.0) * .15 + 2.0 * position.x * B2), -2.0 * position.y * A2, 1.0)); }`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform sampler2D uBack;')
      .replace('#include <map_fragment>', `#ifdef USE_MAP
        vec4 texelColor = gl_FrontFacing ? texture2D(map, vUv) : texture2D(uBack, vec2(1.0 - vUv.x, vUv.y));
        texelColor = mapTexelToLinear(texelColor); diffuseColor *= texelColor;
        #endif`);
  };
  billMesh = new THREE.InstancedMesh(geo, mat, BILLS_MAX); billMesh.frustumCulled = false;
  for (let i = 0; i < BILLS_MAX; i++) { billMesh.setMatrixAt(i, ZERO); billState.push(null); }
  billScene.add(billMesh);
}
function billRain(n) {
  if (reduce) return;
  if (!billMesh) buildBillMesh();
  const hw = billCam.right, spread = 7.5;   // stream length above the screen, in world units
  let k = 0;
  for (let i = 0; i < BILLS_MAX && k < n; i++) if (!billState[i]) {
    const w = hw * 2 * rand(.28, .46);
    billState[i] = { x: rand(-hw, hw), y: VH / 2 + w * .5 + (k / n) * spread + rand(0, .6), z: rand(-8, 8), s: w,
      v: rand(4.0, 5.2), ph: rand(0, 6.28), w1: rand(1.8, 3.2), w2: rand(1.2, 2.2), spin: rand(-2.2, 2.2), rz: rand(-.5, .5), age: 0 };
    k++;
  }
}
const _bq = new THREE.Quaternion(), _be = new THREE.Euler(), _bs = new THREE.Vector3(), _bm = new THREE.Matrix4(), _bp = new THREE.Vector3();
function stepBills(dt) {
  if (!billMesh) return;
  billUniforms.uTime.value += dt;
  let any = false;
  for (let i = 0; i < BILLS_MAX; i++) {
    const b = billState[i]; if (!b) continue; any = true; b.age += dt;
    b.y -= b.v * dt;                                   // constant speed: no slowing, no fading
    b.x += Math.sin(b.age * b.w1 + b.ph) * .7 * dt;    // side-to-side glide
    _be.set(Math.sin(b.age * b.w1 + b.ph) * .55, b.ph + b.age * b.spin, b.rz + Math.sin(b.age * b.w2 + b.ph) * .35, 'XYZ');
    _bq.setFromEuler(_be); _bp.set(b.x, b.y, b.z); _bs.set(b.s, b.s, b.s); _bm.compose(_bp, _bq, _bs); billMesh.setMatrixAt(i, _bm);
    if (b.y < -VH / 2 - b.s) { billState[i] = null; billMesh.setMatrixAt(i, ZERO); }   // gone only once fully below the screen
  }
  if (any) billMesh.instanceMatrix.needsUpdate = true;
  if (any || billsDrawn) { billRenderer.render(billScene, billCam); billsDrawn = any; }
}

async function doFill(amount, method) {
  if (busy || !Number.isFinite(amount) || amount <= 0 || amount > 2000) return; setBusy(true);
  S.P += amount; S.U += amount / S.price;
  S.acts.unshift({ t: 'fill', a: amount, m: method, when: 'Now' });
  countWad(V());
  let remaining = amount, rolledThis = 0;
  while (remaining > 1e-6) {
    if (rolledThis >= 2 && remaining >= 100) {
      const k = Math.floor(remaining / 100); remaining -= k * 100;
      const before = vis.stash; vis.stash += k; rebuildStash(vis.stash); setCounts(); bumpChip('#chipBlunts');
      burst(new THREE.Vector3(0.6, FLOOR + .2, STASH_Z), 50, { power: 1.3 });
      if (Math.floor(vis.stash / 10) > Math.floor(before / 10)) { showStamp('BAND UP'); bumpChip('#chipBands'); billRain(110); await wait(5000); }
      await wait(600); continue;
    }
    const room = 100 - vis.fill, add = Math.min(room, remaining);
    await pour(vis.fill, vis.fill + add, amount > 150 ? 1.7 : 1);
    vis.fill += add; remaining -= add;
    if (vis.fill >= 99.999) { await rollUp(amount > 150); vis.fill = 0; rolledThis++; }
  }
  setCounts(); setBusy(false);
}

/* ================= SPARK ================= */
async function popBands(from, to) {
  const popping = []; for (let b = from; b < Math.min(to, stashBands.length); b++) popping.push(...stashBands[b]);
  showStamp(to - from > 1 ? 'BANDS POPPED' : 'BAND POPPED'); haptic([40, 30, 60]);
  // stretch...
  await tween(.22, t => popping.forEach(m => { const k = 1 + t * .18; m.scale.set(k, k * .92, 1); }), t => t * t);
  // ...snap
  const vel = popping.map(() => new THREE.Vector3(rand(-1.4, 1.4), rand(1.6, 2.6), rand(-.4, 1.2))), spin = popping.map(() => new THREE.Vector3(rand(-9, 9), rand(-9, 9), rand(-9, 9)));
  popping.forEach(m => burst(m.position.clone().add(new THREE.Vector3(0, .1, 0)), 14, { power: 1.3, color: 0xff7a5a }));

const bluntIcon = on => `<svg width="46" height="18" viewBox="0 0 46 18"><defs><radialGradient id="tg"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient></defs><path d="M4 5.5 L38 4 Q42 4 42 9 Q42 14 38 14 L4 12.5 Q2 12.3 2 9 Q2 5.7 4 5.5Z" fill="${on ? '#9a6a3c' : '#4a3424'}"/><path d="M10 5l-2.5 8M18 4.8l-2.5 8.8M26 4.4l-2.5 9.2M34 4.2l-2.5 9.6" stroke="#2c1a0b" stroke-width="1" opacity=".5"/><circle class="tipglow" cx="42" cy="9" r="7" fill="url(#tg)" opacity="${on ? 1 : 0}"/></svg>`;

// Launch backend is Alpaca: payouts go out by ACH to any routing + account number.

const payoutOptions = () => [
  ...(S.cashApp ? [{ k: 'cashapp', speed: 'Minutes' }] : []),

function openSpark() {
  if (busy || S.P <= 0) return;
  const whole = vis.stash, loose = S.P - whole * 100 > 0.005, maxNet = Math.floor(netAll() * 100) / 100;
  let mode = 'blunts', k = whole > 0 ? 1 : 0, all = whole === 0, cash = 0;
  const isMax = () => cash >= maxNet - .005;
  const req = () => mode === 'cash' ? (isMax() ? { mode: 'blunts', all: true } : { mode: 'cash', net: cash }) : { mode: 'blunts', k, all };
  const fit = () => { const i = host.querySelector('#cashIn'); i.style.width = (Math.max(1, i.value.length) * .92 + .5) + 'ch'; };
  const draw = () => {
    fit();
    host.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    host.querySelector('#bluntsMode').hidden = mode !== 'blunts';
    host.querySelector('#cashMode').hidden = mode !== 'cash';
    if (mode === 'blunts') {
      host.querySelector('#sAmt').textContent = '$' + fmt2(sparkPlan(req()).net);
      const lit = all ? whole : k, show = Math.min(Math.max(whole, 1), 10);
      host.querySelector('#sIcons').innerHTML = Array.from({ length: show }, (_, i) => `<span class="bp">${bluntIcon(i < lit)}</span>`).join('');
      host.querySelector('#sK').textContent = all ? 'ALL' : '×' + k;
      host.querySelector('#sMinus').disabled = !all && k <= 1;
      host.querySelector('#sPlus').disabled = all || (k >= whole && !loose);
    }
    host.querySelector('#maxBtn').classList.toggle('on', mode === 'cash' && isMax());
    host.querySelector('#sGo').disabled = mode === 'cash' && !(cash > 0 && cash <= maxNet + .005);
  };
  openSheet(`
    <div class="seg"><button data-m="blunts">${bluntIcon(true)}</button><button data-m="cash">$</button></div>
    <div id="bluntsMode" class="spk">
      <div class="amt gold" id="sAmt" style="align-self:center;font-size:58px">$0</div>
      <div class="spick">
        <button class="step" id="sMinus" aria-label="Fewer blunts">−</button>
        <div class="scount"><div class="blunts-pick" id="sIcons"></div><div class="sk" id="sK">×1</div></div>
        <button class="step" id="sPlus" aria-label="More blunts">+</button>
      </div>
    </div>
    <div id="cashMode" class="spk" hidden>
      <label class="cashin"><span>$</span><input id="cashIn" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount to withdraw"></label>
      <button class="maxb" id="maxBtn">MAX $${fmt2(maxNet)}</button>
    </div>
    <button class="go spark" id="sGo"><svg width="20" height="22" viewBox="0 0 40 44"><path d="M20 3c2 7 11 11 11 22a11 11 0 0 1-22 0c0-6 3-9 5-12 0 4 2 6 4 6-1-6 0-11 2-16z" fill="#2a0e03"/></svg> SPARK</button>`, h => {
    const inp = h.querySelector('#cashIn');
    h.querySelectorAll('.seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); if (mode === 'cash') setTimeout(() => inp.focus(), 50); });
    inp.addEventListener('input', () => {
      let v = inp.value.replace(/[^0-9.]/g, ''); const parts = v.split('.'); if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
      if (v.includes('.')) v = v.slice(0, v.indexOf('.') + 3);
      inp.value = v; cash = parseFloat(v) || 0;
      if (cash > maxNet) { cash = maxNet; inp.value = maxNet.toFixed(2); }
      draw();
    });
    h.querySelector('#maxBtn').onclick = () => { cash = maxNet; inp.value = maxNet.toFixed(2); draw(); };
    h.querySelector('#sMinus').onclick = () => { if (all) { all = whole === 0; k = Math.max(1, whole); } else k = Math.max(1, k - 1); draw(); };
    h.querySelector('#sPlus').onclick = () => { if (all) return; if (k < whole) k++; else if (loose) all = true; draw(); };
    h.querySelector('#sGo').onclick = () => { const r = req(); const pl = sparkPlan(r); if (!pl || pl.net <= 0) return; openCashOut(r, pl.net); };
    draw();
  });
}
function openCashOut(req, amount) {
  openSheet(`
    <div class="amt gold" style="align-self:center;font-size:44px;padding-top:4px">$${fmt2(amount)}</div>
    <div class="outs">${payoutOptions().map(p => p.k === 'addbank'
      ? `<button class="out ghost" data-k="addbank"><span class="plus">+</span><span class="on">Add a bank</span><span class="sp"></span></button>`
      : `<button class="out" data-k="${p.k}">${payBadge(p.k, 44)}<span class="on">${p.label || PAY[p.k].name}</span><span class="sp">${p.speed}</span></button>`).join('')}</div>`, h => {
    h.querySelectorAll('.out').forEach(b => b.onclick = () => {
      if (b.dataset.k === 'addbank') return addBank(() => openCashOut(req, amount));
      S.payOut = b.dataset.k; closeSheet(); doSpark(req, b.dataset.k);
    });
  });
}

// QQQ calendar-year total returns (%), dividends reinvested. Source: Yahoo Finance / Morningstar (research/11); verify vs Invesco before launch.
const QQQ_YEARS = [[2006, 7.14], [2007, 19.02], [2008, -41.73], [2009, 54.70], [2010, 19.91], [2011, 3.38], [2012, 18.12], [2013, 36.63], [2014, 19.18], [2015, 9.45],
  [2016, 7.10], [2017, 32.66], [2018, -0.12], [2019, 38.96], [2020, 48.62], [2021, 27.42], [2022, -32.58], [2023, 54.85], [2024, 25.58], [2025, 20.77]];
function returnsChart() {
  if (!QQQ_YEARS.length) return '<p class="note">Yearly returns chart</p>';
  const W = 300, H = 150, pad = 18, max = Math.max(...QQQ_YEARS.map(d => Math.abs(d[1]))), bw = (W - pad * 2) / QQQ_YEARS.length, zero = H / 2;
  const bars = QQQ_YEARS.map(([y, r], i) => { const h = Math.abs(r) / max * (H / 2 - 16), x = pad + i * bw + 1; return `<rect x="${x.toFixed(1)}" y="${(r >= 0 ? zero - h : zero).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${r >= 0 ? '#8DBB50' : '#E5705A'}"/>`; }).join('');
  const first = QQQ_YEARS[0][0], lastY = QQQ_YEARS[QQQ_YEARS.length - 1][0];
  return `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" style="max-width:340px"><line x1="${pad}" x2="${W - pad}" y1="${zero}" y2="${zero}" stroke="rgba(243,231,207,.25)"/>${bars}
    <text x="${pad}" y="${H + 12}" fill="#A8957A" font-size="11" font-family="Figtree" font-weight="700">${first}</text><text x="${W - pad}" y="${H + 12}" fill="#A8957A" font-size="11" font-family="Figtree" font-weight="700" text-anchor="end">${lastY}</text></svg>`;
}
function bandCardSVG() {
  const r = 11, gap = 1.5, thick = 6, C = [];
  for (let j = 0; j < 10; j++) { const row = Math.floor(j / 5), i = j % 5; C.push([56 + i * 22 + row * 11, 82 - row * 21]); }
  const R = r + 1 + gap + thick / 2, pts = [];
  for (let k = 0; k < 160; k++) { const th = k / 160 * Math.PI * 2, ux = Math.cos(th), uy = Math.sin(th); let best = -1e9, c = C[0]; for (const cc of C) { const d = cc[0] * ux + cc[1] * uy; if (d > best) { best = d; c = cc; } } pts.push(`${(c[0] + ux * R).toFixed(1)},${(c[1] + uy * R).toFixed(1)}`); }
  const circles = C.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#8a5a31" stroke="#5a3418" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#6b9a33"/>`).join('');
  return `<svg viewBox="20 30 170 80" width="230">${circles}<polygon points="${pts.join(' ')}" fill="none" stroke="#b3281f" stroke-width="${thick}" stroke-linejoin="round"/></svg>`;
}

function loadState(st) {
  S = st; vis.stash = Math.floor(S.P / 100 + 1e-9); vis.fill = S.P - vis.stash * 100;
  rebuildStash(vis.stash); presetFill(vis.fill); setPips(vis.fill); wadShown = V(); $('#wad').textContent = fmt(V()); setCounts();

function demo(k) {
  if (busy) return;
  closeSheet();
  if (k === 'up' || k === 'down') { S.price *= k === 'up' ? 1.1 : 0.9; countWad(V()); setCounts(); bumpChip('#grown'); return; }
  if (k === 'sample') loadState(sample());
  if (k === 'empty') loadState({ ...sample(), P: 0, U: 0, price: 1, acts: [], cut: S.cut });
  if (k === 'nine') { const s = sample(); s.P = 990; s.U = 990 / 1.08; s.price = 1.08 * 1.06; loadState(s); }
}
