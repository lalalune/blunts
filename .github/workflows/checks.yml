name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q ad research/model
      - run: python -m unittest discover -s tests
      - run: node --test tests/prototype.test.cjs
      - run: python research/model/market_model.py > /tmp/model_output.md
      - run: diff -u research/model/model_output.md /tmp/model_output.md
